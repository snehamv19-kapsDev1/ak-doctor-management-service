AWSTemplateFormatVersion: '2010-09-09'
Description: Doctor Service REST APIs (Lambda + API Gateway + S3 JSON DB + S3 BACKEND APIS JSON FILE )

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod

  ServiceName:
    Type: String

  CodeBucket:
    Type: String

  CodeKey:
    Type: String

  DatabaseBucket:
    Type: String

  DatabaseKey:
    Type: String

Resources:

# =========================================================
# IAM ROLE
# =========================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: lambda-s3-access

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

              # S3 Access
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${CodeBucket}"
                  - !Sub "arn:aws:s3:::${CodeBucket}/*"
                  - !Sub "arn:aws:s3:::${DatabaseBucket}"
                  - !Sub "arn:aws:s3:::${DatabaseBucket}/*"

# =========================================================
# LAMBDA FUNCTION
# =========================================================
  DoctorServiceFunction:
    Type: AWS::Lambda::Function

    Properties:
      Runtime: python3.11
      Handler: lambda_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 20
      MemorySize: 256

      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey

      Environment:
        Variables:
          DATABASE_BUCKET: !Ref DatabaseBucket
          DATABASE_KEY: !Ref DatabaseKey

# =========================================================
# API GATEWAY
# =========================================================
  Api:
    Type: AWS::ApiGateway::RestApi

    Properties:
      Name: !Sub "${Environment}-${ServiceName}-api"

# =========================================================
# API RESOURCES
# =========================================================

  # /doctors
  DoctorsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: doctors

  # /doctors/{id}
  DoctorByIdResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref Api
      ParentId: !Ref DoctorsResource
      PathPart: "{id}"

# =========================================================
# GET /doctors
# =========================================================
  GetDoctorsMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref DoctorsResource
      HttpMethod: GET
      AuthorizationType: NONE

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorServiceFunction.Arn}/invocations"

# =========================================================
# POST /doctors
# =========================================================
  CreateDoctorMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref DoctorsResource
      HttpMethod: POST
      AuthorizationType: NONE

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorServiceFunction.Arn}/invocations"

# =========================================================
# GET /doctors/{id}
# =========================================================
  GetDoctorByIdMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref DoctorByIdResource
      HttpMethod: GET
      AuthorizationType: NONE

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorServiceFunction.Arn}/invocations"

# =========================================================
# PUT /doctors/{id}
# =========================================================
  UpdateDoctorMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref DoctorByIdResource
      HttpMethod: PUT
      AuthorizationType: NONE

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorServiceFunction.Arn}/invocations"

# =========================================================
# DELETE /doctors/{id}
# =========================================================
  DeleteDoctorMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref DoctorByIdResource
      HttpMethod: DELETE
      AuthorizationType: NONE

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorServiceFunction.Arn}/invocations"

# =========================================================
# LAMBDA PERMISSION FOR API GATEWAY
# =========================================================
  LambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:
      FunctionName: !Ref DoctorServiceFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*"

# =========================================================
# API DEPLOYMENT
# =========================================================
  Deployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:
      - GetDoctorsMethod
      - CreateDoctorMethod
      - GetDoctorByIdMethod
      - UpdateDoctorMethod
      - DeleteDoctorMethod

    Properties:
      RestApiId: !Ref Api
      StageName: !Ref Environment

# =========================================================
# OUTPUTS
# =========================================================
Outputs:

  ApiUrl:
    Description: Base API URL
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  DoctorsEndpoint:
    Description: Doctors Collection Endpoint
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/doctors"

  DoctorByIdEndpoint:
    Description: Doctor By ID Endpoint
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/doctors/{id}"