name:  Update Lambda + Deploy API Gateway (code changes only)

on:
  push:
    branches: [dev, test, main]
    paths:
      - 'code/**'   # 👈 ONLY trigger when application code changes

env:
  AWS_REGION: us-west-2
  SERVICE_NAME: doctor-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------
      # CHECKOUT
      # ----------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------
      # SET ENVIRONMENT
      # ----------------------
      - name: Set Environment
        run: |
          case "${GITHUB_REF_NAME}" in
            main) ENV=prod ;;
            test) ENV=test ;;
            dev)  ENV=dev ;;
            *)
              echo "Invalid branch"
              exit 1
              ;;
          esac

          echo "ENV=$ENV" >> $GITHUB_ENV

      # ----------------------
      # AWS AUTH
      # ----------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------
      # BUILD LAMBDA ZIP
      # ----------------------
      - name: Build lambda zip
        run: |
          mkdir -p build

          cd code
          zip -r ../build/${SERVICE_NAME}.zip . \
            -x "*.git*" "__pycache__/*" "*.pyc"
          cd ..

      # ----------------------
      # GET CODE BUCKET
      # ----------------------
      - name: Get Code Bucket
        run: |
          CODE_BUCKET=$(aws ssm get-parameter \
            --name "/${ENV}/jsvm/code-bucket-name" \
            --query "Parameter.Value" \
            --output text)

          echo "CODE_BUCKET=$CODE_BUCKET" >> $GITHUB_ENV

      # ----------------------
      # UPLOAD ZIP TO S3
      # ----------------------
      - name: Upload Lambda Zip
        run: |
          CODE_KEY="${ENV}/${SERVICE_NAME}.zip"

          aws s3 cp build/${SERVICE_NAME}.zip \
            s3://$CODE_BUCKET/$CODE_KEY

          echo "CODE_KEY=$CODE_KEY" >> $GITHUB_ENV

      # ----------------------
      # UPDATE LAMBDA CODE (FAST PATH)
      # ----------------------
      - name: Update Lambda Function Code
        run: |
          FUNCTION_NAME="${ENV}-jsvm-${SERVICE_NAME}-lambda"

          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --s3-bucket $CODE_BUCKET \
            --s3-key $CODE_KEY

          echo "✅ Lambda updated"

