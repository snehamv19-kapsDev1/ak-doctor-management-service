name: Deploy CRUD S3 Service

on:
  push:
    branches: [dev, test, main]

env:
  AWS_REGION: us-west-2
  SERVICE_NAME: doctor-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------
      # CHECKOUT
      # ----------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------
      # SET ENVIRONMENT
      # ----------------------
      - name: Set Environment
        run: |
          case "${GITHUB_REF_NAME}" in
            main) ENV=prod ;;
            test) ENV=test ;;
            dev)  ENV=dev  ;;
            *)
              echo "❌ Invalid branch"
              exit 1
              ;;
          esac
          echo "ENV=$ENV" >> $GITHUB_ENV

      # ----------------------
      # AWS AUTH
      # ----------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------
      # BUILD LAMBDA ZIP
      # ----------------------
      - name: Build package
        run: |
          mkdir -p build
          cd doctor-service-handler
          zip -r ../build/${SERVICE_NAME}.zip . -x "*.git*" "__pycache__/*" "*.pyc"
          cd ..

      # ----------------------
      # GET DATABASE BUCKET (SSM)
      # ----------------------
      - name: Get Database Bucket
        run: |
          DATABASE_BUCKET=$(aws ssm get-parameter \
            --name "/${ENV}/jsvm/database-bucket-name" \
            --query "Parameter.Value" \
            --output text)

          if [ -z "$DATABASE_BUCKET" ] || [ "$DATABASE_BUCKET" == "None" ]; then
            echo "❌ Database bucket not found in SSM"
            exit 1
          fi

          echo "DATABASE_BUCKET=$DATABASE_BUCKET" >> $GITHUB_ENV

      # ----------------------
      # INITIALIZE doctors.json
      # ----------------------
      - name: Initialize doctors.json
        run: |
          DATABASE_KEY="${ENV}"
          echo "DATABASE_KEY=${DATABASE_KEY}" >> $GITHUB_ENV

          if ! aws s3api head-object \
            --bucket $DATABASE_BUCKET \
            --key "$DATABASE_KEY/doctors.json" 2>/dev/null; then

            echo "Creating doctors.json..."
            echo "[]" > doctors.json

            aws s3 cp doctors.json \
              s3://$DATABASE_BUCKET/$DATABASE_KEY/doctors.json \
              --content-type application/json
          else
            echo "doctors.json already exists"
          fi

      # ----------------------
      # GET CODE BUCKET (SSM)
      # ----------------------
      - name: Get Code Bucket
        run: |
          CODE_BUCKET=$(aws ssm get-parameter \
            --name "/${ENV}/jsvm/code-bucket-name" \
            --query "Parameter.Value" \
            --output text)

          if [ -z "$CODE_BUCKET" ] || [ "$CODE_BUCKET" == "None" ]; then
            echo "❌ Code bucket not found in SSM"
            exit 1
          fi

          echo "CODE_BUCKET=$CODE_BUCKET" >> $GITHUB_ENV

      # ----------------------
      # UPLOAD LAMBDA ZIP
      # ----------------------
      - name: Upload Lambda Zip
        run: |
          CODE_KEY="${ENV}/${SERVICE_NAME}.zip"

          aws s3 cp \
            build/${SERVICE_NAME}.zip \
            s3://$CODE_BUCKET/$CODE_KEY

          echo "CODE_KEY=$CODE_KEY" >> $GITHUB_ENV

      # ----------------------
      # PRINT PARAMETERS (DEBUG)
      # ----------------------
      - name: Print Deployment Parameters
        run: |
          echo "=============================="
          echo "🚀 CloudFormation Parameters"
          echo "=============================="
          echo "ServiceName=${SERVICE_NAME}"
          echo "Environment=${ENV}"
          echo "CodeBucket=${CODE_BUCKET}"
          echo "CodeKey=${CODE_KEY}"
          echo "DatabaseBucket=${DATABASE_BUCKET}"
          echo "DatabaseKey=${DATABASE_KEY}"
          echo "=============================="

      # ----------------------
      # DEPLOY CLOUDFORMATION
      # ----------------------
      - name: Deploy Stack
        run: |
          STACK_NAME="jsvm-${ENV}-${SERVICE_NAME}"

          aws cloudformation deploy \
            --template-file cft/cft-doctor-service-infra.yaml \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ServiceName=${SERVICE_NAME} \
              Environment=${ENV} \
              CodeBucket=${CODE_BUCKET} \
              CodeKey=${CODE_KEY} \
              DatabaseBucket=${DATABASE_BUCKET} \
              DatabaseKey=${DATABASE_KEY}

      # ----------------------
      # OUTPUT API URL
      # ----------------------
      - name: Output API URL
        run: |
          STACK_NAME="jsvm-${ENV}-${SERVICE_NAME}"

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)

          echo "🚀 API URL: $API_URL"
          echo "API_URL=$API_URL" >> $GITHUB_ENV

      # ----------------------
      # SUMMARY
      # ----------------------
      - name: Publish Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** $SERVICE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $ENV" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** $API_URL" >> $GITHUB_STEP_SUMMARY